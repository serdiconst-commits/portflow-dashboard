services:
  - type: web
    name: portflow-dashboard
    runtime: node
    plan: starter
    region: oregon
    buildCommand: unset npm_config_build_from_source && npm install --include=optional --os=linux --cpu=x64 && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    disk:
      name: portflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: VITE_API_BASE
        value: ""
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: DB_PATH
        value: /var/data/portflow.db
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: PORT_HOUSTON_ENABLED
        value: "true"
      - key: PORT_HOUSTON_API_BASE
        sync: false
      - key: PORT_HOUSTON_AUTH_URL
        value: https://auth-v1.america.naviscloudops.com/auth/realms/phaprod/protocol/openid-connect/token
      - key: PORT_HOUSTON_CLIENT_ID
        sync: false
      - key: PORT_HOUSTON_CLIENT_SECRET
        sync: false
      - key: PORT_HOUSTON_API_KEY
        sync: false
      - key: PORT_HOUSTON_USERNAME
        sync: false
      - key: PORT_HOUSTON_PASSWORD
        sync: false
      - key: PORT_HOUSTON_INTERNAL_TOKEN
        sync: false
      - key: PORT_HOUSTON_AUTO_AVAILABILITY_ENABLED
        value: "true"
      - key: PORT_HOUSTON_AUTO_AVAILABILITY_INTERVAL_MINUTES
        value: "15"
      - key: PORT_HOUSTON_AUTO_AVAILABILITY_BATCH_SIZE
        value: "100"
      - key: RESEND_API_KEY
        sync: false
      - key: DRIVER_COMPLIANCE_FROM_EMAIL
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-nano-30b-a3b
      - key: NVIDIA_AI_ENABLED
        value: "true"
      - key: NVIDIA_MAX_INPUT_TOKENS
        value: "12000"
      - key: NVIDIA_MAX_OUTPUT_TOKENS
        value: "1200"
      - key: NVIDIA_TIMEOUT_MS
        value: "45000"
  - type: web
    name: porthouston-integration
    runtime: node
    plan: starter
    region: oregon
    rootDir: services/porthouston-integration
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT_HOUSTON_API_BASE_URL
        value: https://api.america.naviscloudops.com/v3/
      - key: PORT_HOUSTON_AUTH_URL
        value: https://auth-v1.america.naviscloudops.com/auth/realms/phaprod/protocol/openid-connect/token
      - key: PORT_HOUSTON_CLIENT_ID
        sync: false
      - key: PORT_HOUSTON_CLIENT_SECRET
        sync: false
      - key: PORT_HOUSTON_WEBHOOK_SECRET
        generateValue: true
      - key: PORTFLOW_TMS_API_BASE_URL
        value: https://portflow-dashboard.onrender.com
      - key: PORTFLOW_TMS_EIR_UPLOAD_URL
        value: https://portflow-dashboard.onrender.com/api/port-houston/eir-upload
      - key: PORTFLOW_TMS_API_TOKEN
        sync: false
